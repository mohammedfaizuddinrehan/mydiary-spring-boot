<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Edit Diary Entry</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #10121b;
            color: white;
            max-width: 750px;
            margin: 50px auto;
            padding: 20px;
        }

        input, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            margin: 10px 0 20px;
            border: 1px solid #303347;
            border-radius: 8px;
            background: #1a1d2b;
            color: white;
            font-size: 16px;
        }

        textarea {
            min-height: 250px;
            resize: vertical;
        }

        button, a {
            display: inline-block;
            padding: 12px 20px;
            background: #8b5cf6;
            color: white;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
        }

        a {
            background: #374151;
        }
    </style>


</head>

<body>


<h1>Edit Your Diary ✏️</h1>

<form th:action="@{/diary/edit/{id}(id=${entry.id})}" method="post">

    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}">

    <label for="title">Diary Title</label>

    <input type="text"
           id="title"
           name="title"
           th:value="${entry.title}"
           maxlength="150"
           required>

    <label for="content">Your Thoughts</label>

    <textarea id="content"
              name="content"
              th:text="${entry.content}"
              required></textarea>

    <button type="submit">Update Entry</button>

    <a href="/diary">Cancel</a>

</form>


</body>
</html>
