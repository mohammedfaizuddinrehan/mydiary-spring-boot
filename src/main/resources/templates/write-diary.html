<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write My Diary</title>


    <style>
        body {
            font-family: Arial, sans-serif;
            background: #10121b;
            color: white;
            max-width: 750px;
            margin: 50px auto;
            padding: 20px;
        }

        input, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            margin: 10px 0 20px;
            border: 1px solid #303347;
            border-radius: 8px;
            background: #1a1d2b;
            color: white;
            font-size: 16px;
        }

        textarea {
            min-height: 250px;
            resize: vertical;
        }

        button, .home-link {
            display: inline-block;
            padding: 12px 20px;
            background: #8b5cf6;
            color: white;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
        }

        .message {
            color: #86efac;
        }
    </style>
    ```

</head>

<body>

```
<h1>Write Your Diary ✍️</h1>
<p>Your thoughts, your space.</p>

<p class="message" th:if="${message}" th:text="${message}"></p>

<form th:action="@{/diary/new}" method="post">

    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}">

    <label for="title">Diary Title</label>
    <input type="text" id="title" name="title"
           placeholder="Give your entry a title"
           maxlength="150" required>

    <label for="content">Your Thoughts</label>
    <textarea id="content" name="content"
              placeholder="Write about your day..."
              required></textarea>

    <button type="submit">Save Entry</button>

</form>

<br><br>

<a href="/home" class="home-link">← Back to Home</a>


</body>
</html>
